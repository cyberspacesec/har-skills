<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
  <title id="title">HAR Skills capability tree</title>
  <desc id="desc">A tree-style mind map showing HAR Skills agent access, parsing, inspection, analysis, operations, comparison, and export capabilities.</desc>
  <style>
    :root {
      color-scheme: light;
    }
    .bg {
      fill: #f8fafc;
    }
    .grid {
      stroke: #e2e8f0;
      stroke-width: 1;
      opacity: 0.55;
    }
    .title {
      fill: #0f172a;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 34px;
      font-weight: 780;
      letter-spacing: 0;
    }
    .subtitle {
      fill: #475569;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 17px;
      font-weight: 450;
      letter-spacing: 0;
    }
    .root-card {
      fill: #0f172a;
      filter: drop-shadow(0 16px 34px rgba(15, 23, 42, 0.2));
    }
    .root-title {
      fill: #ffffff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 23px;
      font-weight: 760;
      letter-spacing: 0;
    }
    .root-subtitle {
      fill: #cbd5e1;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0;
    }
    .tag {
