<circle cx="415" cy="186" r="10" fill="#2563eb" opacity="0.18" />
<circle cx="415" cy="186" r="5" fill="#2563eb" />
<text class="branch-title" x="432" y="185"><tspan x="432" dy="0">Agent Access</tspan></text>
<text class="branch-summary" x="408" y="216"><tspan x="408" dy="0">AI-first entry points</tspan></text>
<circle cx="408" cy="243" r="3.5" fill="#2563eb" />
<text class="item" x="424" y="248"><tspan x="424" dy="0">CLAUDE.md skill guide</tspan></text>
<circle cx="408" cy="266" r="3.5" fill="#2563eb" />
