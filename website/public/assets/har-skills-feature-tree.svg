<circle cx="408" cy="491" r="3.5" fill="#16a34a" />
<text class="item" x="424" y="496"><tspan x="424" dy="0">URL, regex, method, status</tspan></text>
<circle cx="408" cy="514" r="3.5" fill="#16a34a" />
<text class="item" x="424" y="519"><tspan x="424" dy="0">headers, cookies, domains</tspan></text>
<circle cx="408" cy="537" r="3.5" fill="#16a34a" />
<text class="item" x="424" y="542"><tspan x="424" dy="0">timing, waterfall, content</tspan></text>
</g>
<g class="branch" id="analyze">
<rect class="card" x="910" y="375" width="450" height="204" rx="8" />
<rect x="910" y="375" width="8" height="204" rx="4" fill="#9333ea" />
<circle cx="945" cy="411" r="10" fill="#9333ea" opacity="0.18" />
<circle cx="945" cy="411" r="5" fill="#9333ea" />
