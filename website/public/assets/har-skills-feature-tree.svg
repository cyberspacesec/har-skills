  <rect class="bg" width="1440" height="940" />
  <path class="grid" d="M 0 96 H 1440 M 0 824 H 1440 M 340 116 V 812 M 870 116 V 812" />

  <text class="title" x="58" y="64"><tspan x="58" dy="0">HAR Skills Capability Tree</tspan></text>
  <text class="subtitle" x="58" y="95"><tspan x="58" dy="0">AI-native HAR analysis for agents, CLIs, SDKs, and automation pipelines</tspan></text>

  <g id="root">
    <rect class="root-card" x="62" y="386" width="248" height="120" rx="8" />
    <rect x="84" y="408" width="94" height="24" rx="6" fill="#1e293b" />
    <text class="tag" x="98" y="425"><tspan x="98" dy="0">AI-native</tspan></text>
    <text class="root-title" x="86" y="462"><tspan x="86" dy="0">HAR Skills</tspan></text>
    <text class="root-subtitle" x="86" y="488"><tspan x="86" dy="0">HTTP Archive toolkit</tspan></text>
  </g>

