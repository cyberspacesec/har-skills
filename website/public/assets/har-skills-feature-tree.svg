      font-size: 13px;
      font-weight: 720;
      letter-spacing: 0;
    }
    .connector {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      opacity: 0.55;
    }
    .card {
      fill: #ffffff;
      stroke: #dbe4ee;
      stroke-width: 1;
      filter: drop-shadow(0 10px 22px rgba(15, 23, 42, 0.08));
    }
