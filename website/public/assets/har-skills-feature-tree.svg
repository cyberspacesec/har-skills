</g>
<g class="branch" id="compare-and-export">
<rect class="card" x="910" y="600" width="450" height="204" rx="8" />
<rect x="910" y="600" width="8" height="204" rx="4" fill="#475569" />
<circle cx="945" cy="636" r="10" fill="#475569" opacity="0.18" />
<circle cx="945" cy="636" r="5" fill="#475569" />
<text class="branch-title" x="962" y="635"><tspan x="962" dy="0">Compare &amp; Export</tspan></text>
<text class="branch-summary" x="938" y="666"><tspan x="938" dy="0">Package traffic for teams and tools</tspan></text>
<circle cx="938" cy="693" r="3.5" fill="#475569" />
<text class="item" x="954" y="698"><tspan x="954" dy="0">diff, merge, split</tspan></text>
<circle cx="938" cy="716" r="3.5" fill="#475569" />
